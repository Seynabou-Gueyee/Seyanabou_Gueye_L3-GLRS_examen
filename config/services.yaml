# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # Enregistrement des interfaces de repositories
    App\Repository\BurgerRepositoryInterface:
        class: App\Repository\Impl\BurgerRepository
        
    App\Repository\MenuRepositoryInterface:
        class: App\Repository\Impl\MenuRepository
        
    App\Repository\ComplementRepositoryInterface:
        class: App\Repository\Impl\ComplementRepository
        
    App\Repository\CommandeRepositoryInterface:
        class: App\Repository\Impl\CommandeRepository
        
    App\Repository\UserRepositoryInterface:
        class: App\Repository\Impl\UserRepository
        
    App\Repository\ZoneRepositoryInterface:
        class: App\Repository\Impl\ZoneRepository

    # Enregistrement des interfaces de services
    App\Service\BurgerServiceInterface:
        class: App\Service\Impl\BurgerService
        
    App\Service\MenuServiceInterface:
        class: App\Service\Impl\MenuService
        
    App\Service\ComplementServiceInterface:
        class: App\Service\Impl\ComplementService
        
    App\Service\CommandeServiceInterface:
        class: App\Service\Impl\CommandeService

    App\Service\ZoneServiceInterface:
        class: App\Service\Impl\ZoneService
        
    App\Service\Interface\UserServiceInterface:
        class: App\Service\Impl\UserService

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
